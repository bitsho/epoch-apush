ound:#e2d7c6;overflow:hidden}.bar-fill{height:100%;border-radius:inherit;min-width:0}.medal-count{text-align:right;font-weight:900;color:#173e58}.recent-chart{height:112px;background:#fbf4e8;border:1px solid #d6c0a0;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.recent-chart svg{width:100%;height:100%;display:block}.recent-empty{font-size:13px;color:#7a878c;text-align:center}.chart-grid-line{stroke:#d8cbb8;stroke-width:1;stroke-dasharray:3 4}.chart-line{fill:none;stroke:#2b7897;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:#f4c23a;stroke:#173e58;stroke-width:1.5}.stats-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(176,146,104,.35)}

<body>
<div class="app">
  <header class="top">
    <div class="top-left"><button class="new-main-btn" id="newMissionMain" type="button"><span class="refresh">↻</span><span class="new-label" data-i18n="newMission">New mission</span></button></div>
    <div class="brand" id="epochHomeBrand" role="link" tabindex="0" title="Home"><span class="accent">APUSH</span> CODENAMES</div>
    <div class="top-right">
      <button class="lang-btn" id="langBtn" aria-label="Language">中文</button>
      <button class="round-btn" id="statsBtn" aria-label="History"><span class="chart-icon"><i></i><i></i><i></i></span></button>
      <button class="round-btn" id="settingsBtn" aria-label="Settings">⚙</button>
      <button class="round-btn" id="helpBtn" aria-label="Help">?</button>
    </div>
  </header>

  <section class="status">
    <div class="stars" id="stars"></div>
    <div class="remaining" id="remaining">Preparing mission…</div>
  </section>

  <main class="board" id="board"></main>

  <div class="clue-row"><div class="clue"><span id="clueWord">Clue</span><span class="n" id="clueNum">2</span></div></div>
  <div class="feedback" id="feedback"></div>

 score+=wantedWords.filter(w=>titleWords.has(w)).length*12;

 if(/\(.*(united states|american|history|politics|law|movement|war|economic|president|court).*\)/i.test(page.title||''))score+=10;

async function fallbackSearch(term){

  term.name,
  [term.name,...hints].join(' '),
  term.name+' United States history'

 let best=null,bestScore=-Infinity;
 for(const query of queries){
  try{
   const url=wikiApi('en',{action:'query',generator:'search',gsrsearch:query,gsrnamespace:'0',gsrlimit:'10',prop:'pageimages|langlinks|pageprops|info',piprop:'thumbnail',pithumbsize:'560',lllang:'zh',lllimit:'1',inprop:'url'});
   const data=await fetchJSON(url);
   for(const page of (data.query?.pages||[])){
    const score=scoreWikiCandidate(term,page);
    if(score>bestScore){bestScore=score;best=page}

   if(best&&bestScore>=100)break;
  }catch(e){}

}
async function firstImageForPage(title){

  if(!files.length)return null;
  const q=await fetchJSON(wikiApi('en',{action:'query',prop:'imageinfo',titles:files.slice(0,5).join('|'),iiprop:'url',iiurlwidth:'560'}));

async function fetchWikidataLabels(items){

async function hydrateWiki(terms){
 const pending=terms.filter(term=>!wikiCache.has(term.name));
 if(!pending.length){for(const term of terms)term.wiki=wikiCache.get(term.name);return}

  const titles=pending.map(x=>x.name).join('|');
  const data=await withTimeout(fetchJSON(wikiApi('en',{action:'query',titles,redirects:'1',prop:'pageimages|langlinks|pageprops|info',piprop:'thumbnail',pithumbsize:'560',lllang:'zh',lllimit:'1',inprop:'url'})),9000);
  const redirects=new Map((data.query?.redirects||[]).map(x=>[x.from.toLowerCase(),x.to]));
  const normalized=new Map((data.query?.normalized||[]).map(x=>[x.from.toLowerCase(),x.to]));
  const pages=new Map((data.query?.pages||[]).filter(p=>!p.missing).map(p=>[p.title.toLowerCase(),p]));

  for(const term of pending){
    let resolved=normalized.get(term.name.toLowerCase())||term.name;resolved=redirects.get(resolved.toLowerCase())||resolved;
    let page=pages.get(resolved.toLowerCase());
    if(!page||isWikiDisambiguation(page)){try{page=await withTimeout(fallbackSearch(term),6500)}catch(e){page=null}}
    if(page&&isWikiDisambiguation(page))page=null;
    let image=page?.thumbnail?.source||null;if(page&&!image)image=await firstImageForPage(page.title);
    const zhLink=page?.langlinks?.[0]||null;

 }catch(e){
  for(const term of pending){const meta={enTitle:term.name,enUrl:wikiPageUrl('en',term.name),zhTitle:null,zhUrl:null,image:WIKI_FALLBACK,qid:null,zhLabel:null};wikiCache.set(term.name,meta);term.wiki=meta}
 }

}

function chooseMissionFast(){
 for(let attempt=0;attempt<28;attempt++){
   const useProcess=game.difficulty==='hard'&&Math.random()<.28;
   const spec=useProcess?(chooseProcessSpec()||chooseClusterSpec()):chooseClusterSpec();
   if(!spec)continue;
   const mission=buildMissionFromSpec(spec);if(mission)return mission;
 }
 for(let attempt=0;attempt<60;attempt++){const spec=chooseClusterSpec();if(!spec)break;const mission=buildMissionFromSpec(spec);if(mission)return mission}
 return{board:[],evaluation:null};
}
function enforceUniqueRenderedCards(board){
 const usedPages=new Set(),usedZh=new Set(),usedEn=new Set(),usedDisplayEn=new Set(),usedDisplayZh=new Set();
 for(const term of board){
   const meta=term.wiki;
   const raw=termKey(term);
   let collision=false;
   if(meta){
     const pageKey=meta.qid?('qid:'+String(meta.qid).toLowerCase()):('title:'+String(meta.enTitle||'').trim().toLowerCase());
     if(pageKey!=='title:'&&usedPages.has(pageKey))collision=true;
     if(pageKey!=='title:')usedPages.add(pageKey);
     const enKey=String(meta.enTitle||'').trim().toLowerCase();
     if(enKey&&usedEn.has(enKey)&&enKey!==raw)collision=true;
     if(enKey)usedEn.add(enKey);
   }
   // If two distinct source terms were resolved to the same wiki entity, keep the second
   // card term-specific instead of displaying a duplicate page/image/title.
   if(collision){
     term.wiki={
       enTitle:term.name,enUrl:wikiPageUrl('en',term.name),
       zhTitle:null,zhUrl:null,image:WIKI_FALLBACK,qid:null,zhLabel:null
     };
     wikiCache.set(term.name,term.wiki);
   }

   // Chinese labels can also collapse two distinct English concepts to one visible string.
   const zhLabel=String(term.wiki?.zhLabel||term.wiki?.zhTitle||'').trim().toLowerCase();
   if(zhLabel){
     if(usedZh.has(zhLabel)){
       term.wiki.zhLabel=null;
       term.wiki.zhTitle=null;
       term.wiki.zhUrl=null;
     }else usedZh.add(zhLabel);
   }

   // Final visible-label invariants in both languages. Fall back to the canonical APUSH term
   // when a localized/canonical wiki title would create a duplicate card face.
   const enDisplay=String(term.wiki?.enTitle||term.name).trim().toLowerCase();
   if(usedDisplayEn.has(enDisplay)){term.wiki.enTitle=term.name;term.wiki.enUrl=wikiPageUrl('en',term.name)}
   usedDisplayEn.add(String(term.wiki?.enTitle||term.name).trim().toLowerCase());

   const zhDisplay=String(term.wiki?.zhLabel||term.wiki?.zhTitle||term.name).trim().toLowerCase();
   if(usedDisplayZh.has(zhDisplay)){term.wiki.zhLabel=null;term.wiki.zhTitle=null;term.wiki.zhUrl=null}
   usedDisplayZh.add(String(term.wiki?.zhLabel||term.wiki?.zhTitle||term.name).trim().toLowerCase());
 }
}
async function hydrateMissionWiki(board,missionId){
 try{await hydrateWiki(board)}catch(e){}
 if(missionId!==game.missionId||game.board!==board)return;
 enforceUniqueRenderedCards(board);
 // Once Chinese titles arrive, preserve the visible no-overlap rule. If play has not begun,
 // also opportunistically replace the clue with the strongest fully bilingual-legal alternative.
 if(game.lang==='zh'&&game.guesses===0&&!legalClueZh(game.eval.clue,board)){
  let variants=[];
  if(game.eval.clusterId!==null&&game.eval.clusterId!==undefined)variants=clueVariantsForCluster(game.eval.clusterId);
  else if(game.eval.processTag)variants=[clueFromWord(game.eval.clue.word,[game.eval.processTag],{source:'process',processTag:game.eval.processTag})];
  const legal=variants.filter(c=>!BROAD_CLUES.has(c.word)&&legalClueEn(c,board)&&legalClueZh(c,board));
  if(legal.length){
    const chosen=legal[0];game.eval.clue=chosen;
    game.eval.margin=Math.min(...game.eval.targets.map(x=>scoreTerm(x.term,chosen)))-Math.max(0,...game.eval.decoys.map(x=>scoreTerm(x.term,chosen)));
  }

}
function generate(){

/* === EPOCH SITE INTEGRATION BRIDGE ===
   Works standalone and exposes a stable contract for the host site.
   The host may provide window.EPOCH_SITE_BRIDGE.recordGameResult(payload)
   and window.EPOCH_SITE_BRIDGE.openAnalytics("codenames").
*/
const EPOCH_GAME_TYPE='codenames';
const EPOCH_SCHEMA_VERSION=1;
const EPOCH_GUEST_RESULTS_KEY='epochGuestGameResultsV1';

const missionGuessLog=[];

function makeResultId(){
  try{return 'codenames-'+crypto.randomUUID()}
  catch(e){return 'codenames-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
}
function readJSONStorage(key,fallback){
  try{const v=JSON.parse(localStorage.getItem(key));return v==null?fallback:v}catch(e){return fallback}
}
function writeJSONStorage(key,value){
  try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}
}
function compactTermRecord(term){
  return {term:term.name,unit:Number(term.unit)||null};
}
function buildEpochResult(){
  const targetTerms=[...game.targets].map(i=>game.board[i]);
  const wrongTerms=[...game.wrong].map(i=>game.board[i]);
  const accuracy=game.guesses?Math.round(game.correct/game.guesses*100):100;
  const medal=game.stars===3?'perfect':game.stars===2?'gold':game.stars===1?'silver':'bronze';
  return {
    schemaVersion:EPOCH_SCHEMA_VERSION,
    resultId:makeResultId(),
    gameType:EPOCH_GAME_TYPE,
    score:accuracy,
    completedAt:new Date().toISOString(),
    details:{
      accuracy,
      medal,
      livesRemaining:game.stars,
      difficulty:game.difficulty,
      pool:game.pool,
      clue:clueLabel(game.eval.clue,'en'),
      clueLocalized:clueLabel(game.eval.clue,game.lang),
      clueNumber:game.eval.count,
      correctGuesses:game.correct,
      totalGuesses:game.guesses,
      targets:targetTerms.map(compactTermRecord),
      wrongTerms:wrongTerms.map(compactTermRecord),
      guesses:missionGuessLog.map(x=>({...x})),
      targetUnits:[...new Set(targetTerms.map(x=>Number(x.unit)).filter(Boolean))].sort((a,b)=>a-b),
      language:game.lang
    }
  };
}
function rememberRecordedId(id){
  const ids=readJSONStorage(EPOCH_RECORDED_IDS_KEY,[]);
  if(ids.includes(id))return false;
  ids.push(id);writeJSONStorage(EPOCH_RECORDED_IDS_KEY,ids.slice(-250));return true;
}
function storeGuestEpochResult(payload){
  const rows=readJSONStorage(EPOCH_GUEST_RESULTS_KEY,[]);
  if(rows.some(x=>x&&x.resultId===payload.resultId))return;
  rows.push(payload);writeJSONStorage(EPOCH_GUEST_RESULTS_KEY,rows.slice(-500));
}
function queuePendingEpochResult(payload){
  const rows=readJSONStorage(EPOCH_PENDING_RESULTS_KEY,[]);
  if(rows.some(x=>x&&x.resultId===payload.resultId))return;
  rows.push(payload);writeJSONStorage(EPOCH_PENDING_RESULTS_KEY,rows.slice(-200));
}
async function reportEpochResult(payload){
  if(!rememberRecordedId(payload.resultId))return;
  const bridge=window.EPOCH_SITE_BRIDGE;
  if(bridge&&typeof bridge.recordGameResult==='function'){
    try{
      const ok=await bridge.recordGameResult(payload);
      if(ok!==false)return;
    }catch(e){}
    queuePendingEpochResult(payload);
    return;
  }
  // CustomEvent/postMessage make the game compatible with either same-page shells or iframe hosts.
  try{window.dispatchEvent(new CustomEvent('epoch:game-result',{detail:payload}))}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'epoch:game-result',payload},location.origin)}catch(e){}
  storeGuestEpochResult(payload);
}
function openUnifiedAnalytics(){
  const bridge=window.EPOCH_SITE_BRIDGE;
  if(bridge&&typeof bridge.openAnalytics==='function'){bridge.openAnalytics(EPOCH_GAME_TYPE);return true}
  try{
    window.dispatchEvent(new CustomEvent('epoch:open-analytics',{detail:{gameType:EPOCH_GAME_TYPE}}));
    if(window.parent&&window.parent!==window)window.parent.postMessage({type:'epoch:open-analytics',gameType:EPOCH_GAME_TYPE},location.origin);
  }catch(e){}
  return false;
}

function commonTargetTags(){const ts=[...game.targets].map(i=>game.board[i]);const c={};for(const x of ts)for(const tag of x.tags)c[tag]=(c[tag]||0)+1;return Object.entries(c).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}

 if(game.generating||game.missionDone||game.found.has(idx)||game.wrong.has(idx))return;game.guesses++;const term=game.board[idx],fb=document.getElementById('feedback');

function wikiInternalTarget(href,currentLang,currentTitle){

  const lang=m[1];let title=null;
  if(u.pathname.startsWith('/wiki/'))title=decodeURIComponent(u.pathname.slice(6)).replaceAll('_',' ');
  else if(u.pathname==='/w/index.php')title=u.searchParams.get('title');
  if(!title||u.searchParams.get('action')==='edit')return null;
  return{lang,title,hash:u.hash||''};
 }catch(e){return null}
}
function sanitizeWikiHtml(rawHtml,lang,currentTitle){
 const box=document.createElement('div');box.innerHTML=rawHtml||'';
 for(const sel of WIKI_BLOCKED_SELECTORS)box.querySelectorAll(sel).forEach(n=>n.remove());
 box.querySelectorAll('*').forEach(el=>{
  [...el.attributes].forEach(a=>{if(/^on/i.test(a.name))el.removeAttribute(a.name)});
 });
 box.querySelectorAll('img').forEach(img=>{
  const src=img.getAttribute('src');if(src){try{img.src=new URL(src,`https://${lang}.wikipedia.org`).href}catch(e){}}
  img.removeAttribute('srcset');img.loading='lazy';img.referrerPolicy='no-referrer';
 });
 box.querySelectorAll('a[href]').forEach(a=>{
  const raw=a.getAttribute('href');if(!raw)return;
  if(raw.startsWith('#'))return;
  const target=wikiInternalTarget(raw,lang,currentTitle);
  try{a.href=new URL(raw,`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(currentTitle.replaceAll(' ','_'))}`).href}catch(e){}
  if(target){
   if(target.lang===lang&&target.title.replaceAll('_',' ').toLowerCase()===currentTitle.replaceAll('_',' ').toLowerCase()&&target.hash){a.href=target.hash;return}
   a.dataset.wikiLang=target.lang;a.dataset.wikiTitle=target.title;a.removeAttribute('target');a.removeAttribute('rel');
  }else{a.target='_blank';a.rel='noopener noreferrer'}
 });
 return box.innerHTML;
}
async function fetchWikiPage(lang,title,fallbackImage){
 const key=lang+'|'+title.toLowerCase();if(wikiPageCache.has(key))return wikiPageCache.get(key);
 const variant=lang==='zh'?{variant:'zh-cn'}:{};
 try{
  const qParams={action:'query',titles:title,redirects:'1',prop:'pageimages|info|langlinks',piprop:'thumbnail',pithumbsize:'1000',inprop:'url',lllang:lang==='en'?'zh':'en',lllimit:'1',...variant};
  const qData=await withTimeout(fetchJSON(wikiApi(lang,qParams)),9000);const page=qData.query?.pages?.[0];if(!page||page.missing||isWikiDisambiguation(page))throw new Error('missing-or-disambiguation');
  const canonical=page.title;const pParams={action:'parse',page:canonical,prop:'text|displaytitle',disableeditsection:'1',...variant};
  const pData=await withTimeout(fetchJSON(wikiApi(lang,pParams)),10000);const rawHtml=pData.parse?.text||'';
  const alt=page.langlinks?.[0]?.title||null;
  const data={lang,title:canonical,displayTitle:pData.parse?.displaytitle||canonical,html:sanitizeWikiHtml(rawHtml,lang,canonical),image:page.thumbnail?.source||fallbackImage||WIKI_FALLBACK,url:page.fullurl||wikiPageUrl(lang,canonical),zhTitle:lang==='zh'?canonical:alt,enTitle:lang==='en'?canonical:alt,error:false};
  wikiPageCache.set(key,data);return data;
 }catch(e){return{lang,title,displayTitle:title,html:'',image:fallbackImage||WIKI_FALLBACK,url:wikiPageUrl(lang,title),zhTitle:lang==='zh'?title:null,enTitle:lang==='en'?title:null,error:true}}
}
function currentWikiEntry(){return game.wikiHistory[game.wikiHistoryIndex]||null}
function updateWikiNav(){
 const entry=currentWikiEntry();document.getElementById('wikiBack').disabled=game.wikiHistoryIndex<=0;document.getElementById('wikiForward').disabled=game.wikiHistoryIndex<0||game.wikiHistoryIndex>=game.wikiHistory.length-1;
 const zh=document.getElementById('wikiZhBtn'),en=document.getElementById('wikiEnBtn');
 zh.hidden=!entry?.zhTitle;en.hidden=!entry?.enTitle;zh.classList.toggle('active',entry?.lang==='zh');en.classList.toggle('active',entry?.lang==='en');
}
function pushWikiEntry(entry){
 game.wikiHistory=game.wikiHistory.slice(0,game.wikiHistoryIndex+1);game.wikiHistory.push(entry);game.wikiHistoryIndex=game.wikiHistory.length-1;game.wikiLang=entry.lang;renderWiki();
}
async function renderWiki(){
 const entry=currentWikiEntry(),body=document.getElementById('wikiBody');if(!entry)return;const token=++game.wikiRenderToken;updateWikiNav();
 body.innerHTML='<p>'+escapeHtml(t('wikiLoading'))+'</p>';document.getElementById('wikiModalHeading').textContent=t('wiki');
 const data=await fetchWikiPage(entry.lang,entry.title,entry.fallbackImage);if(token!==game.wikiRenderToken||entry!==currentWikiEntry())return;
 entry.title=data.title;entry.enTitle=data.enTitle||entry.enTitle;entry.zhTitle=data.zhTitle||entry.zhTitle;entry.url=data.url;game.wikiLang=entry.lang;updateWikiNav();
 const unavailable=data.error?'<div class="wiki-note">'+escapeHtml(t('wikiUnavailable'))+'</div>':'';
 const hero=data.image&&data.image!==WIKI_FALLBACK?'<img class="wiki-hero" src="'+escapeHtml(data.image)+'" alt="" referrerpolicy="no-referrer">':'';
 const article=data.html?'<div class="wiki-content">'+data.html+'</div>':'<p class="muted">'+escapeHtml(t('wikiUnavailable'))+'</p>';
 body.innerHTML=unavailable+hero+'<h3 class="wiki-article-title">'+(data.displayTitle||escapeHtml(data.title))+'</h3>'+article+'<div class="wiki-source-row"><a class="wiki-source-link" href="'+escapeHtml(data.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(t('openFull'))+'</a></div>';
 body.scrollTop=0;
}
function openWiki(term){
 game.wikiTerm=term;game.wikiHistory=[];game.wikiHistoryIndex=-1;
 const hasZh=!!term.wiki?.zhTitle;const preferZh=game.lang==='zh'&&hasZh;const lang=preferZh?'zh':'en';const title=preferZh?term.wiki.zhTitle:(term.wiki?.enTitle||term.name);
 pushWikiEntry({lang,title,enTitle:term.wiki?.enTitle||term.name,zhTitle:term.wiki?.zhTitle||null,fallbackImage:term.wiki?.image||WIKI_FALLBACK});open('wikiModal');
 if(!term.wiki){hydrateWiki([term]).then(()=>{if(game.wikiTerm!==term||!document.getElementById('wikiModal').classList.contains('show'))return;const entry=currentWikiEntry();if(!entry)return;entry.enTitle=term.wiki?.enTitle||entry.enTitle;entry.zhTitle=term.wiki?.zhTitle||entry.zhTitle;entry.fallbackImage=term.wiki?.image||entry.fallbackImage;updateWikiNav();if(game.lang==='zh'&&entry.zhTitle&&entry.lang!=='zh')switchWikiLang('zh')})}
}
function closeWiki(){close('wikiModal');game.wikiTerm=null;game.wikiHistory=[];game.wikiHistoryIndex=-1;game.wikiRenderToken++}
function navigateWiki(lang,title){pushWikiEntry({lang,title,enTitle:lang==='en'?title:null,zhTitle:lang==='zh'?title:null,fallbackImage:WIKI_FALLBACK})}
function switchWikiLang(lang){
 const entry=currentWikiEntry();if(!entry)return;const title=lang==='zh'?entry.zhTitle:entry.enTitle;if(!title)return;entry.lang=lang;entry.title=title;game.wikiLang=lang;renderWiki();
}
function moveWikiHistory(delta){const next=game.wikiHistoryIndex+delta;if(next<0||next>=game.wikiHistory.length)return;game.wikiHistoryIndex=next;game.wikiLang=currentWikiEntry().lang;renderWiki()}

function open(id){document.getElementById(id).classList.add('show')}function close(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
document.getElementById('helpBtn').onclick=()=>open('helpModal');document.getElementById('settingsBtn').onclick=()=>open('settingsModal');document.getElementById('statsBtn').onclick=()=>{if(!openUnifiedAnalytics())showStats()};
document.getElementById('difficulty').onchange=e=>game.difficulty=e.target.value;document.getElementById('pool').onchange=e=>game.pool=e.target.value;
document.getElementById('newMissionMain').onclick=()=>generate();
document.getElementById('resetStats').onclick=()=>{localStorage.removeItem('apushCodenamesStatsV2');showStats()};
document.getElementById('langBtn').onclick=()=>{game.lang=game.lang==='en'?'zh':'en';applyI18n();if(document.getElementById('wikiModal').classList.contains('show')){const entry=currentWikiEntry();const desired=game.lang==='zh'?'zh':'en';if(entry&&((desired==='zh'&&entry.zhTitle)||(desired==='en'&&entry.enTitle)))switchWikiLang(desired);else updateWikiNav()}};
document.getElementById('wikiClose').onclick=closeWiki;document.getElementById('wikiZhBtn').onclick=()=>switchWikiLang('zh');document.getElementById('wikiEnBtn').onclick=()=>switchWikiLang('en');document.getElementById('wikiBack').onclick=()=>moveWikiHistory(-1);document.getElementById('wikiForward').onclick=()=>moveWikiHistory(1);
document.getElementById('wikiBody').addEventListener('click',e=>{const a=e.target.closest('a[data-wiki-title]');if(!a)return;e.preventDefault();navigateWiki(a.dataset.wikiLang,a.dataset.wikiTitle)});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m){if(m.id==='wikiModal')closeWiki();else if(m.id!=='resultModal')m.classList.remove('show')}}));

const epochHomeBrand=document.getElementById('epochHomeBrand');
function goEpochHome(){
 const bridge=window.EPOCH_SITE_BRIDGE;
 if(bridge&&typeof bridge.goHome==='function'){bridge.goHome();return}
 try{
   window.dispatchEvent(new CustomEvent('epoch:go-home'));
   if(window.parent&&window.parent!==window){window.parent.postMessage({type:'epoch:go-home'},location.origin);return}
   if(/^https?:$/.test(location.protocol))location.href='/';
 }catch(e){}
}
epochHomeBrand?.addEventListener('click',goEpochHome);
epochHomeBrand?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goEpochHome()}});

applyI18n();generate();
</script>
